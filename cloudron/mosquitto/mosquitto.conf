# Configurazione di Mosquitto per Cloudron (generata da start.sh: non modificare
# la copia in /run, modifica /app/data/mosquitto-extra.conf per le aggiunte).
per_listener_settings false
allow_anonymous false
password_file /app/data/passwd
acl_file /app/data/acl

persistence true
persistence_location /app/data/persistence/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# MQTT su TLS (porta esposta da Cloudron, certificato dell'indirizzo dell'app)
listener 8883
protocol mqtt
certfile /run/mosquitto/certs/tls_cert.pem
keyfile /run/mosquitto/certs/tls_key.pem
tls_version tlsv1.2

# WebSocket: Cloudron lo pubblica in HTTPS su https://<indirizzo-app>/ (wss://)
# e lo usa anche per il controllo di salute (pagina statica in /app/code/www)
listener 8080
protocol websockets
http_dir /app/code/www

include_dir /run/mosquitto/extra
